[project]
name = "ml-graph-compiler"
version = "0.1.0"
description = "A deep learning graph compiler: ONNX import, SSA IR, optimization passes, static memory planning and C code generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
dependencies = [
    "numpy>=1.26",
    "onnx>=1.16",
]

[project.scripts]
mgc = "ml_graph_compiler.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "onnxruntime>=1.18",
]
# Model export and comparison benchmarks (PyTorch, torchvision, transformers): uv sync --group bench
bench = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44,<5",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_graph_compiler"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Mathematical names (X, W, M, N, K) follow the usual notation.
"**/*.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["ml_graph_compiler"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "torch.*", "torchvision.*", "transformers.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q -p no:cacheprovider --basetemp=.pytest-tmp"
markers = [
    "slow: larger tests",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
